# ─────────────────────────────────────────────────────────────────────────────
# StudyFlow — servidor de descargas
#
# Sirve la carpeta ./public (index.html, version.json y los ZIP del paquete
# Windows). Cloudflare Tunnel se encarga del TLS y de exponerlo sin abrir
# puertos; aquí solo hay un nginx leyendo ficheros de disco.
# Ojo: el bind mount es ./public → solo se publica lo que haya en public/;
# esta carpeta y wireframes/ quedan fuera del contenedor.
#
# Uso en el servidor (dentro de esta carpeta):
#   docker compose up -d
#   docker compose ps
#
# Para que sobreviva a un reinicio hacen falta DOS cosas:
#   1. `restart: unless-stopped` (abajo) → el contenedor vuelve solo.
#   2. El servicio Docker habilitado al arranque: `systemctl enable docker`
# ─────────────────────────────────────────────────────────────────────────────
services:
  downloads:
    image: nginx:alpine
    container_name: studyflow-downloads
    restart: unless-stopped
    ports:
      # 8090 a propósito: 8081 es la v3 y 8085 el hub. Cámbialo si está ocupado.
      - "8090:80"
    volumes:
      # Solo se sirve ./public (página + ZIPs + version.json).
      - ./public:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
