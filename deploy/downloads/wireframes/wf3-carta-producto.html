<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>WF3 — Carta de producto</title>
<style>
  body{margin:0;font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;background:#eef0f3;color:#2b2f36}
  .wrap{max-width:960px;margin:0 auto;padding:24px}
  .lab{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#8b929e;margin-bottom:4px}
  .box{background:#fff;border:2px dashed #b9c0cc;border-radius:8px}
  .ph{background:repeating-linear-gradient(45deg,#e6e9ee,#e6e9ee 8px,#dfe3e9 8px,#dfe3e9 16px);
      border-radius:6px;display:flex;align-items:center;justify-content:center;color:#98a0ad;font-size:12px;text-align:center}
  .hero{padding:34px 26px;margin-bottom:10px;background:#e9ecf1}
  .badge{display:inline-block;height:20px;width:120px;border-radius:99px;background:#d3d9e2;margin-bottom:14px}
  .h1{height:30px;width:64%;border-radius:5px;background:#cdd4de;margin-bottom:10px}
  .p{height:11px;border-radius:3px;background:#dde2e9;margin-bottom:8px}
  .p.short{width:55%}
  .cta{height:54px;width:270px;border-radius:10px;margin-top:18px;background:#59606d;color:#fff;
       display:flex;align-items:center;justify-content:center;font-weight:700}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .feat{padding:18px}
  .ic{width:34px;height:34px;border-radius:8px;background:#d3d9e2;margin-bottom:12px}
  .t{height:11px;width:75%;border-radius:3px;background:#d3d9e2;margin-bottom:8px}
  .b{height:9px;border-radius:3px;background:#e6e9ee;margin-bottom:6px}
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
  .step{padding:14px}
  .num{width:22px;height:22px;border-radius:99px;background:#59606d;color:#fff;font-size:12px;
       display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:10px}
  .table{margin-top:10px;padding:0;overflow:hidden}
  .tr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0}
  .td{padding:12px 16px;border-bottom:1px solid #e6e9ee;font-size:12px;color:#7d848f}
  .td.h{background:#f4f6f9;font-weight:700;color:#5c6470;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
</style></head><body><div class="wrap">

  <div class="box" style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;margin-bottom:10px">
    <div style="display:flex;gap:10px;align-items:center">
      <div style="width:22px;height:22px;border-radius:6px;background:#c3cad6"></div>
      <div style="width:96px;height:12px;border-radius:3px;background:#cfd5de"></div>
    </div>
    <div class="ph" style="width:150px;height:30px;border-radius:8px">⬇ Descargar</div>
  </div>

  <div class="box hero">
    <div class="lab">hero ancho · argumento principal</div>
    <div class="badge"></div>
    <div class="h1"></div>
    <div class="p"></div><div class="p"></div><div class="p short"></div>
    <div class="cta">⬇ DESCARGAR PARA WINDOWS</div>
  </div>

  <div class="three">
    <div class="box feat">
      <div class="ic"></div><div class="t"></div><div class="b"></div><div class="b"></div>
    </div>
    <div class="box feat">
      <div class="ic"></div><div class="t"></div><div class="b"></div><div class="b"></div>
    </div>
    <div class="box feat">
      <div class="ic"></div><div class="t"></div><div class="b"></div><div class="b"></div>
    </div>
  </div>

  <div class="lab" style="margin:16px 0 0">instalación en 4 pasos</div>
  <div class="steps">
    <div class="box step"><div class="num">1</div><div class="b"></div><div class="b" style="width:70%"></div></div>
    <div class="box step"><div class="num">2</div><div class="b"></div><div class="b" style="width:70%"></div></div>
    <div class="box step"><div class="num">3</div><div class="b"></div><div class="b" style="width:70%"></div></div>
    <div class="box step"><div class="num">4</div><div class="b"></div><div class="b" style="width:70%"></div></div>
  </div>

  <div class="lab" style="margin:16px 0 0">especificaciones + integridad</div>
  <div class="box table">
    <div class="tr"><div class="td h">versión</div><div class="td h">tamaño</div><div class="td h">sha256</div></div>
    <div class="tr"><div class="td">3.0.0 · 07/10/2026</div><div class="td">52 MB</div><div class="td">2ab08dac…70c9f</div></div>
    <div class="tr"><div class="td">requisitos</div><div class="td">Windows 10/11 x64</div><div class="td">Python 3 · Edge</div></div>
  </div>
</div></body></html>
