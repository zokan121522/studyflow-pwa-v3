<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>WF2 — Dos columnas</title>
<style>
  body{margin:0;font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;background:#eef0f3;color:#2b2f36}
  .wrap{max-width:1000px;margin:0 auto;padding:24px}
  .lab{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#8b929e;margin-bottom:4px}
  .box{background:#fff;border:2px dashed #b9c0cc;border-radius:8px}
  .ph{background:repeating-linear-gradient(45deg,#e6e9ee,#e6e9ee 8px,#dfe3e9 8px,#dfe3e9 16px);
      border-radius:6px;display:flex;align-items:center;justify-content:center;color:#98a0ad;font-size:12px;text-align:center}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .left{padding:30px 26px;border-right:2px dashed #d5dae2}
  .h1{height:24px;width:88%;border-radius:4px;background:#d3d9e2;margin-bottom:10px}
  .h1b{height:24px;width:62%;border-radius:4px;background:#d3d9e2;margin-bottom:16px}
  .p{height:10px;border-radius:3px;background:#e2e6ec;margin-bottom:8px}
  .cta{height:52px;width:250px;border-radius:10px;margin:20px 0 12px;background:#59606d;color:#fff;
       display:flex;align-items:center;justify-content:center;font-weight:700}
  .meta{display:flex;gap:14px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#8b929e}
  .right{background:#f7f8fa;display:flex;align-items:center;justify-content:center;padding:18px}
  .shot{width:100%;height:230px}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .card{padding:16px}
  .card h4{margin:0 0 8px;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:#8b929e;font-weight:700}
  .li{height:9px;border-radius:3px;background:#e2e6ec;margin-bottom:7px}
  .li.short{width:70%}
</style></head><body><div class="wrap">

  <div class="box" style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;margin-bottom:10px">
    <div class="logo" style="display:flex;gap:10px;align-items:center">
      <div style="width:22px;height:22px;border-radius:6px;background:#c3cad6"></div>
      <div style="width:96px;height:12px;border-radius:3px;background:#cfd5de"></div>
    </div>
    <div style="display:flex;gap:8px">
      <div style="width:52px;height:10px;border-radius:3px;background:#d8dde5"></div>
      <div style="width:52px;height:10px;border-radius:3px;background:#d8dde5"></div>
    </div>
  </div>

  <div class="box split">
    <div class="left">
      <div class="lab">titular + botón (izquierda)</div>
      <div class="h1"></div><div class="h1b"></div>
      <div class="p"></div><div class="p" style="width:82%"></div><div class="p short"></div>
      <div class="cta">⬇ DESCARGAR · 52 MB</div>
      <div class="meta"><span>v3.0.0</span><span>sha256 2ab08dac…</span><span>07/10/2026</span></div>
    </div>
    <div class="right">
      <div class="ph shot">captura de la app<br>(vista previa real)</div>
    </div>
  </div>

  <div class="duo">
    <div class="box card">
      <h4>cómo se instala</h4>
      <div class="li"></div><div class="li short"></div><div class="li"></div><div class="li short"></div>
    </div>
    <div class="box card">
      <h4>requisitos</h4>
      <div class="li"></div><div class="li short"></div><div class="li"></div>
      <div class="li" style="background:#f2e2d6;width:85%"></div>
    </div>
  </div>

  <div class="box" style="margin-top:10px;padding:16px">
    <div class="lab">aviso integridad / smart screen — banda destacada</div>
    <div class="ph" style="height:38px">⚠ Paquete sin firmar · verifica el SHA256 antes de ejecutar</div>
  </div>
</div></body></html>
