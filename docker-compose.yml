version: '3.8'

services:
  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/studyflow
      - SECRET_KEY=dev-secret-change-in-production
      - JWT_SECRET_KEY=jwt-secret-change-in-production
      - JWT_ACCESS_TOKEN_EXPIRES=3600
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080
      - PDF_UPLOAD_FOLDER=/app/uploads/pdfs
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - pdf_uploads:/app/uploads/pdfs

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: studyflow
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  pdf_uploads: