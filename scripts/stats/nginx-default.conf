# /etc/nginx/conf.d/default.conf — contenedor studyflow-downloads
# Copia fiel de la config oficial nginx:alpine + location /stats con Basic Auth.
# Instalación (ver scripts/stats/README.md):
#   docker cp nginx-default.conf studyflow-downloads:/etc/nginx/conf.d/default.conf
#   docker cp .htpasswd studyflow-downloads:/etc/nginx/.htpasswd
#   docker exec studyflow-downloads nginx -t && docker exec studyflow-downloads nginx -s reload
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # ── Páxina interna de estadísticas (PROTEGIDA con Basic Auth) ─────────────
    #   https://studyflowhub.dev/stats  →  /stats.html
    #   usuario: señor   contraseña: studyflow-stats-2026
    # El `^~` tiene prioridad sobre `location /` y cubre /stats y /stats.html.
    location ^~ /stats {
        root   /usr/share/nginx/html;
        index  stats.html;
        try_files $uri $uri/ $uri.html =404;

        auth_basic           "StudyFlow Stats";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
